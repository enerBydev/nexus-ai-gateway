name: CI/CD Pipeline

# THE PIPELINE IS THE TASKFILE. This workflow does not repeat its commands, it invokes it, so
# local and CI cannot drift apart. Before 2026-09-07 this file ran `cargo test`, `cargo clippy`
# and `cargo fmt -- --check` as loose steps: the repo already had a `Taskfile.yaml` declaring
# all of them, and editing it changed nothing about what CI actually did. That gap is the
# permanent bug class TEST-5 exists to close -- "works locally, fails in CI".
#
# It also means CI now runs `sanitize-unicode-check`, which the Taskfile always had and this
# file never called. A check nobody executes is a check nobody has.
#
# ONE JOB, NOT FIVE. The five parallel jobs shared no cargo cache, so each one paid for its own
# build of the whole crate graph. A single job builds once and reuses it across clippy, test
# and the release build. Parallelism that recompiles everything five times is not speed.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-

      # The whole gate, in one command, the same one anybody runs on their machine.
      - name: Run the gate
        run: task ci

  # THE SECOND IDENTITY (methodOS CODE-2). GitHub will not let an author approve their own
  # pull request, so "a verdict from an identity other than the author" has to be someone else
  # for real: a GitHub App. Without it this repo merged pull requests with no review at all --
  # the last ten went in with zero verdicts.
  #
  # WHY THE ACTION IS FETCHED BY HAND INSTEAD OF `uses: enerBydev/methodOS/...@main`.
  # That direct form fails here, and the reason was measured on 2026-09-07:
  #
  #     Unable to resolve action `enerbydev/methodos`, not found
  #
  # It is NOT a permissions mistake. methodOS has `access_level: user`, and a PRIVATE sibling
  # of this repo resolves that very same action without trouble. What differs is the
  # visibility of the CONSUMER: a public repository cannot resolve an action that lives in a
  # private one, same owner or not. GitHub's sharing settings do not reach across that line --
  # and neither do they reach across OWNERS, which is why the repos of the organisations
  # cannot use it either.
  #
  # So the kit is fetched explicitly: mint a short-lived App token scoped to reading methodOS,
  # check it out, and run the action from the working copy. Three steps that behave the same
  # whatever the repo is -- public or private, user or organisation. No repository is excluded
  # by what it happens to be, which is the whole point of a shared standard.
  #
  # The token is minted per run, is read-only on a single repository, and is revoked when the
  # job ends. There is no long-lived credential sitting in this public repo.
  veredicto:
    runs-on: ubuntu-latest
    needs: gate
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    # EL SECRETO SE PASA POR `env` Y NO SE MIRA EN EL `if:` DIRECTAMENTE. El contexto
    # `secrets` NO esta disponible en `jobs.<id>.steps[*].if` — GitHub lo documenta en su
    # tabla de disponibilidad de contextos—, asi que `if: secrets.X != ''` se evalua siempre
    # como falso y el job se saltaria entero, en silencio y para siempre. La forma correcta
    # es exponerlo como variable de entorno y preguntar por ella.
    env:
      HAY_KIT: ${{ secrets.METHODOS_REVISOR_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      # Sin secretos no se puede: en un PR desde un FORK, GitHub no se los da al workflow, y
      # eso es correcto. El job informa el hueco y no rompe el CI, igual que hacia antes.
      - name: Token de lectura sobre methodOS
        id: kit
        if: env.HAY_KIT != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.METHODOS_REVISOR_APP_ID }}
          private-key: ${{ secrets.METHODOS_REVISOR_PRIVATE_KEY }}
          owner: enerBydev
          repositories: methodOS
          permission-contents: read

      - name: Traer el kit de methodOS
        if: steps.kit.outputs.token != ''
        uses: actions/checkout@v7
        with:
          repository: enerBydev/methodOS
          token: ${{ steps.kit.outputs.token }}
          path: .methodos
          persist-credentials: false

      - name: Veredicto de CODE-2
        if: steps.kit.outputs.token != ''
        uses: ./.methodos/.github/actions/veredicto
        with:
          app-id: ${{ secrets.METHODOS_REVISOR_APP_ID }}
          private-key: ${{ secrets.METHODOS_REVISOR_PRIVATE_KEY }}
          gate-verde: ${{ needs.gate.result == 'success' }}

      - name: Sin kit, se informa el hueco
        if: steps.kit.outputs.token == ''
        run: |
          echo "::notice::sin credencial del App revisor (PR desde un fork): CODE-2 queda sin veredicto, y el medidor lo dira en rojo."

  # Release job -- runs after the gate passes on main.
  # Note: actual releases are created by auto-version.yml.
  release:
    needs: [gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(cat VERSION)
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} exists - release handled by auto-version.yml"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.tag }} not found - auto-version.yml will handle release"
          fi

      - name: CI Pipeline Summary
        run: |
          echo "## CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The gate ran \`task ci\`: audit, deny, unicode, fmt, clippy, tests, release build" >> $GITHUB_STEP_SUMMARY
          echo "and the binary version check -- the same command that runs on a workstation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag exists**: ${{ steps.check_tag.outputs.exists }}" >> $GITHUB_STEP_SUMMARY
